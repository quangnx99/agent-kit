<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>osf agents</title>
<link rel="icon" href="data:,">
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9; --panel: #ffffff; --line: #d9dde3; --text: #1f2328; --muted: #57606a;
  --accent: #1d4ed8; --osf: #6d28d9; --osf-bg: #f3efff;
  --running: #1d4ed8; --done: #15803d; --cut: #c2410c; --stalled: #a16207; --idle: #4b5563; --none: #6b7280;
  --sel: #e8f0fe; --err-bg: #fff1ec; --warn-bg: #fff8e1;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #2c313c; --text: #e6e8eb; --muted: #a0a7b4;
    --accent: #7aa7ff; --osf: #c4a7ff; --osf-bg: #231a3a;
    --running: #7aa7ff; --done: #4ade80; --cut: #fb923c; --stalled: #facc15; --idle: #a0a7b4; --none: #8b93a1;
    --sel: #1e2a44; --err-bg: #3a1d12; --warn-bg: #352a0c;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; }
header .sub { color: var(--muted); font-size: 12px; }
.counts { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr) 380px; height: calc(100% - 49px); }
.col { overflow: auto; border-right: 1px solid var(--line); min-height: 0; }
.col:last-child { border-right: 0; }
.left { background: var(--panel); padding: 12px; }
.center { padding: 16px; }
.right { background: var(--panel); padding: 16px; }
label.lbl { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
.sessions { list-style: none; padding: 0; margin: 12px 0 0; }
.sessions li { margin: 0 0 6px; }
.sessions button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 8px; padding: 8px; font: inherit; cursor: pointer; }
.sessions button[aria-current="true"] { border-color: var(--accent); background: var(--sel); }
.sessions .t { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sessions .m { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; margin-top: 2px; }
button:focus-visible, [tabindex]:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.st { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.st-running { color: var(--running); } .st-done { color: var(--done); } .st-cut { color: var(--cut); }
.st-stalled { color: var(--stalled); } .st-idle { color: var(--idle); } .st-not-spawned { color: var(--none); }
.st-running .ico { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.root { font-weight: 700; margin: 0 0 12px; }
.skill { border-left: 2px solid var(--line); margin: 0 0 14px 6px; padding-left: 12px; }
.skill h3 { font-size: 13px; margin: 0 0 6px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.skill h3 .args { color: var(--muted); font-weight: 400; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60ch; }
.wave { margin: 0 0 10px; }
.wave .wl { font-size: 12px; color: var(--muted); margin: 0 0 4px; }
.wave.nested { margin-left: 24px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.card { width: 230px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel); cursor: pointer; }
.card.osf { border-left: 4px solid var(--osf); }
.card.osf .type { color: var(--osf); }
.card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card.is-running { animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--running) 35%, transparent); } }
@media (prefers-reduced-motion: reduce) { .card.is-running, .st-running .ico { animation: none; } }
.card .type { font-size: 12px; font-weight: 700; }
.card .desc { margin: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .now { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
.chip.osf { color: var(--osf); border-color: var(--osf); background: var(--osf-bg); }
.idle h2, .right h2 { font-size: 13px; margin: 16px 0 6px; }
.idle ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; }
.right h2:first-child { margin-top: 0; }
pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 0; max-height: 320px; overflow: auto; font: 12px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; }
ol.tl { padding-left: 22px; margin: 0; max-height: 260px; overflow: auto; font-size: 12px; }
ol.tl li { margin-bottom: 2px; }
ol.tl .tool { font-weight: 600; }
ol.tl .tgt { color: var(--muted); word-break: break-all; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; color: var(--muted); }
.kv b { color: var(--text); font-weight: 600; }
.msg { padding: 24px; color: var(--muted); text-align: center; }
.banner { border-radius: 8px; padding: 8px 12px; margin: 0 0 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.banner.err { background: var(--err-bg); color: var(--cut); }
.banner.warn { background: var(--warn-bg); color: var(--stalled); }
.banner button { font: inherit; border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 6px; padding: 2px 10px; cursor: pointer; }
.note { font-size: 12px; margin: 4px 0 0; }
.note.cut { color: var(--cut); } .note.warn { color: var(--stalled); }
[hidden] { display: none !important; }
@media (max-width: 1000px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  .col { border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <h1>osf agents</h1>
  <span class="sub">Chỉ đọc · chỉ máy này · Claude Code</span>
  <div class="counts" id="counts" aria-live="polite"></div>
</header>
<div class="layout">
  <nav class="col left" aria-label="Sessions">
    <label class="lbl" for="project">Project</label>
    <select id="project"></select>
    <div id="sessState" class="msg" hidden></div>
    <ul class="sessions" id="sessions"></ul>
  </nav>
  <main class="col center" id="center" aria-label="Cây agent">
    <div id="banner"></div>
    <div id="tree"><div class="msg">Đang tải…</div></div>
    <section class="idle" id="idle" aria-label="Loại agent đang rảnh"></section>
  </main>
  <aside class="col right" id="detail" aria-label="Chi tiết agent">
    <div class="msg">Chọn một agent để xem brief, timeline và báo cáo.</div>
  </aside>
</div>
<script>
'use strict';
// Status icons: SVG paths from Lucide (https://lucide.dev), ISC License,
// Copyright (c) Lucide Contributors. Static constants only — never user text.
const ICONS = {
  running: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
  done: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  cut: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  stalled: '<circle cx="12" cy="12" r="10"/><line x1="10" x2="10" y1="15" y2="9"/><line x1="14" x2="14" y1="15" y2="9"/>',
  idle: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  'not-spawned': '<path d="M10.1 2.182a10 10 0 0 1 3.8 0"/><path d="M13.9 21.818a10 10 0 0 1-3.8 0"/><path d="M17.609 3.721a10 10 0 0 1 2.69 2.7"/><path d="M2.182 13.9a10 10 0 0 1 0-3.8"/><path d="M20.279 17.609a10 10 0 0 1-2.7 2.69"/><path d="M21.818 10.1a10 10 0 0 1 0 3.8"/><path d="M3.721 6.391a10 10 0 0 1 2.7-2.69"/><path d="M6.391 20.279a10 10 0 0 1-2.69-2.7"/>',
};
const LABELS = { running: 'Đang chạy', done: 'Xong', cut: 'Bị cắt', stalled: 'Treo', idle: 'Rảnh', 'not-spawned': 'Chưa gọi' };

const $ = (id) => document.getElementById(id);
const S = { project: null, sessions: [], sessionId: null, data: null, selected: null, es: null, sessTimer: null };

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : String(v));
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return n;
}
function icon(status) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('class', 'ico');
  svg.setAttribute('aria-hidden', 'true');
  svg.innerHTML = ICONS[status] || ICONS.done; // static constant markup
  return svg;
}
function badge(status) {
  return el('span', { class: `st st-${status}`, role: 'img', 'aria-label': LABELS[status] || status }, icon(status), el('span', { 'aria-hidden': 'true' }, LABELS[status] || status));
}
const fmtTime = (iso) => { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleString(); };
const ago = (iso) => {
  if (!iso) return '';
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 60) return `${Math.round(s)}s trước`;
  if (s < 3600) return `${Math.round(s / 60)} phút trước`;
  if (s < 86400) return `${Math.round(s / 3600)} giờ trước`;
  return new Date(iso).toLocaleDateString();
};
async function getJson(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${r.status} ${url}`);
  return r.json();
}
function banner(kind, text, retry) {
  const b = $('banner');
  b.replaceChildren();
  if (!kind) return;
  b.append(el('div', { class: `banner ${kind}`, role: kind === 'err' ? 'alert' : 'status' },
    badge(kind === 'err' ? 'cut' : 'stalled'), el('span', null, text),
    retry ? el('button', { type: 'button', onclick: retry }, 'Thử lại') : null));
}

// ---------- projects & sessions ----------
async function loadProjects() {
  try {
    const { projects, defaultProject } = await getJson('/api/projects');
    const sel = $('project');
    sel.replaceChildren(...projects.map((p) => el('option', { value: p.name }, p.name)));
    const fromHash = new URLSearchParams(location.hash.slice(1));
    const want = fromHash.get('project') || defaultProject;
    S.project = projects.some((p) => p.name === want) ? want : (projects[0] && projects[0].name) || null;
    if (S.project) sel.value = S.project;
    await loadSessions(fromHash.get('id'));
  } catch (e) {
    $('tree').replaceChildren();
    banner('err', `Không tải được danh sách project (${e.message}).`, () => { banner(); loadProjects(); });
  }
}
$('project').addEventListener('change', (e) => { S.project = e.target.value; S.sessionId = null; loadSessions(); });

async function loadSessions(wantId) {
  clearTimeout(S.sessTimer);
  const st = $('sessState');
  if (!S.project) { st.hidden = false; st.textContent = 'Chưa có session nào có agent'; return; }
  if (!S.sessions.length) { st.hidden = false; st.textContent = 'Đang tải…'; }
  try {
    const { sessions } = await getJson(`/api/sessions?project=${encodeURIComponent(S.project)}`);
    S.sessions = sessions.filter((s) => s.agentCount > 0);
    st.hidden = S.sessions.length > 0;
    st.textContent = 'Chưa có session nào có agent';
    renderSessions();
    if (!S.sessions.length) {
      closeStream(); S.sessionId = null; S.data = null;
      $('tree').replaceChildren(el('div', { class: 'msg' }, 'Chưa có session nào có agent'));
      $('idle').replaceChildren(); $('counts').replaceChildren();
    } else if (!S.sessionId || !S.sessions.some((s) => s.id === S.sessionId)) {
      const id = wantId && S.sessions.some((s) => s.id === wantId) ? wantId : S.sessions[0].id;
      selectSession(id);
    }
  } catch (e) {
    st.hidden = false;
    st.replaceChildren(el('span', null, `Lỗi tải sessions (${e.message}). `), el('button', { type: 'button', onclick: () => loadSessions() }, 'Thử lại'));
  }
  S.sessTimer = setTimeout(() => loadSessions(), 10000);
}
function renderSessions() {
  $('sessions').replaceChildren(...S.sessions.map((s) => el('li', null,
    el('button', { type: 'button', 'aria-current': s.id === S.sessionId ? 'true' : 'false', onclick: () => selectSession(s.id) },
      el('span', { class: 't', title: s.title || s.id }, s.title || s.id),
      el('span', { class: 'm' }, s.anyRunning ? badge('running') : null, `${s.agentCount} agent`, ' · ', ago(s.updatedAt))))));
}

// ---------- session stream ----------
function closeStream() { if (S.es) { S.es.close(); S.es = null; } }
function selectSession(id) {
  if (S.sessionId !== id) S.selected = null;
  S.sessionId = id;
  history.replaceState(null, '', `#project=${encodeURIComponent(S.project)}&id=${encodeURIComponent(id)}`);
  renderSessions();
  closeStream();
  banner();
  if (!S.data || S.data.id !== id) $('tree').replaceChildren(el('div', { class: 'msg' }, 'Đang tải…'));
  const es = new EventSource(`/api/events?project=${encodeURIComponent(S.project)}&id=${encodeURIComponent(id)}`);
  S.es = es;
  es.addEventListener('session', (ev) => {
    let d;
    try { d = JSON.parse(ev.data); } catch { return; }
    if (d.error) { banner('err', 'Session không còn tồn tại.', () => loadSessions()); return; }
    banner();
    S.data = d;
    render();
  });
  es.onerror = () => {
    if (es.readyState === EventSource.CLOSED) {
      banner('err', 'Mất kết nối tới server agents.', () => selectSession(id));
    } else {
      banner('err', 'Mất kết nối, đang thử lại…', () => selectSession(id));
    }
  };
}

// ---------- render ----------
function render() {
  const d = S.data;
  const c = d.counts || {};
  $('counts').replaceChildren(...['running', 'stalled', 'cut', 'done'].filter((k) => c[k]).map((k) => el('span', null, badge(k), ' ', c[k])));
  const w = d.warnings || {};
  const skipped = (w.malformedLines || 0) + (w.badMeta || 0);
  const center = $('center');
  const scroll = center.scrollTop;
  const tree = el('div', null, el('p', { class: 'root' }, 'Session: ', d.title || d.id));
  if (skipped || w.unlinkedAgents || w.truncated) {
    const parts = [];
    if (skipped) parts.push(`Bỏ qua ${skipped} dòng/tệp hỏng`);
    if (w.truncated) parts.push(`${w.truncated} transcript quá lớn, chỉ đọc phần đầu và phần cuối`);
    if (w.unlinkedAgents) parts.push(`${w.unlinkedAgents} agent không nối được với lệnh gọi`);
    tree.append(el('div', { class: 'banner warn', role: 'status' }, badge('stalled'), el('span', null, parts.join(' · '))));
  }
  const agents = new Map(d.agents.map((a) => [a.id, a]));
  const childWaves = new Map();
  for (const wv of d.waves) if (wv.parentAgentId) {
    if (!childWaves.has(wv.parentAgentId)) childWaves.set(wv.parentAgentId, []);
    childWaves.get(wv.parentAgentId).push(wv);
  }
  const waveBlock = (wv, nested) => {
    const block = el('div', { class: `wave${nested ? ' nested' : ''}` },
      el('div', { class: 'wl' }, `Wave ${wv.index}`, wv.agentIds.length > 1 ? ` · ${wv.agentIds.length} song song` : '',
        nested && agents.get(wv.parentAgentId) ? ` · từ ${agents.get(wv.parentAgentId).description || agents.get(wv.parentAgentId).type}` : ''),
      el('div', { class: 'row' }, wv.agentIds.map((id) => card(agents.get(id)))));
    const out = [block];
    for (const id of wv.agentIds) for (const cw of childWaves.get(id) || []) out.push(...waveBlock(cw, true));
    return out;
  };
  const rootWaves = d.waves.filter((wv) => !wv.parentAgentId);
  const groups = [];
  for (const sk of d.skills) {
    const ws = rootWaves.filter((wv) => wv.skillId === sk.id);
    groups.push(el('section', { class: 'skill', 'aria-label': `Skill ${sk.name}` },
      el('h3', null, el('span', null, sk.source === 'command' ? `/${sk.name}` : `Skill ${sk.name}`), sk.args ? el('span', { class: 'args', title: sk.args }, sk.args) : null),
      ws.length ? ws.map((wv) => waveBlock(wv, false)) : el('div', { class: 'wl' }, 'không gọi agent')));
  }
  const loose = rootWaves.filter((wv) => !wv.skillId);
  if (loose.length) groups.push(el('section', { class: 'skill', 'aria-label': 'Ngoài skill' }, el('h3', null, 'Gọi trực tiếp'), loose.map((wv) => waveBlock(wv, false))));
  const unlinked = d.agents.filter((a) => a.wave == null);
  if (unlinked.length) groups.push(el('section', { class: 'skill', 'aria-label': 'Chưa liên kết' }, el('h3', null, 'Chưa liên kết'), el('div', { class: 'row' }, unlinked.map(card))));
  tree.append(...groups);
  const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.agent : null;
  $('tree').replaceChildren(tree);
  center.scrollTop = scroll;
  if (focused) { const f = [...tree.querySelectorAll('.card')].find((n) => n.dataset.agent === focused); if (f) f.focus({ preventScroll: true }); }

  const idle = d.idleTypes || [];
  $('idle').replaceChildren(...(idle.length ? [el('h2', null, 'Loại agent osf không chạy'), el('ul', null, idle.map((t) =>
    el('li', null, badge(t.state), ' ', t.type, t.count ? ` (${t.count})` : '')))] : []));
  renderDetail();
}

function card(a) {
  if (!a) return null;
  const now = a.doingNow || (a.status === 'done' || a.status === 'cut' ? null : a.lastTool);
  const open = () => { S.selected = a.id; render(); const d = $('detail'); d.focus({ preventScroll: true }); d.scrollTop = 0; };
  return el('div', {
    class: `card${a.isOsf ? ' osf' : ''}${a.status === 'running' ? ' is-running' : ''}`,
    role: 'button', tabindex: 0, 'data-agent': a.id, 'aria-pressed': S.selected === a.id ? 'true' : 'false',
    'aria-label': `${a.type}: ${a.description || ''} — ${LABELS[a.status] || a.status}`,
    onclick: open,
    onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } },
  },
    el('div', { style: 'display:flex;justify-content:space-between;gap:6px;align-items:center' },
      el('span', { class: 'type' }, a.type), badge(a.status)),
    el('div', { class: 'desc', title: a.description }, a.description || '—'),
    now ? el('div', { class: 'now', title: `${now.tool} ${now.target}` }, `${now.tool} ${now.target}`) : null,
    a.status === 'cut' && a.statusReason ? el('div', { class: 'now' }, a.statusReason) : null,
    a.reportWarning ? el('div', { class: 'now' }, a.reportWarning) : null);
}

function renderDetail() {
  const box = $('detail');
  box.setAttribute('tabindex', '-1');
  const a = S.data && S.data.agents.find((x) => x.id === S.selected);
  if (!a) { box.replaceChildren(el('div', { class: 'msg' }, 'Chọn một agent để xem brief, timeline và báo cáo.')); return; }
  const tl = a.toolTimeline || [];
  const keep = box.dataset.agent === a.id ? box.scrollTop : 0;
  box.dataset.agent = a.id;
  box.replaceChildren(
    el('h2', null, a.type),
    el('div', null, badge(a.status), ' ', a.isOsf ? el('span', { class: 'chip osf' }, 'osf') : el('span', { class: 'chip' }, 'khác')),
    a.statusReason ? el('p', { class: `note ${a.status === 'cut' ? 'cut' : 'warn'}` }, a.statusReason) : null,
    a.reportWarning ? el('p', { class: 'note warn' }, a.reportWarning) : null,
    el('p', null, a.description || ''),
    el('div', { class: 'kv' },
      el('span', null, 'Bắt đầu'), el('b', null, fmtTime(a.startedAt)),
      el('span', null, 'Kết thúc'), el('b', null, a.endedAt ? fmtTime(a.endedAt) : '—'),
      el('span', null, 'Hoạt động cuối'), el('b', null, `${fmtTime(a.lastActivityAt)} (${ago(a.lastActivityAt)})`),
      el('span', null, 'Wave'), el('b', null, a.wave ?? '—'),
      el('span', null, 'Model'), el('b', null, a.model || '—'),
      el('span', null, 'Chạy nền'), el('b', null, a.background ? 'có' : 'không'),
      el('span', null, 'Agent id'), el('b', null, a.id)),
    el('h2', null, 'Đang làm'),
    el('p', null, a.doingNow ? `${a.doingNow.tool} ${a.doingNow.target}` : '—'),
    el('h2', null, 'Brief'),
    el('pre', null, a.brief || '—'),
    el('h2', null, `Timeline tool (${tl.length})`),
    tl.length ? el('ol', { class: 'tl' }, tl.map((t) => el('li', null, el('span', { class: 'tool' }, t.tool), ' ', el('span', { class: 'tgt' }, t.target)))) : el('p', null, '—'),
    el('h2', null, 'Báo cáo cuối'),
    el('pre', null, a.report || '—'),
  );
  box.scrollTop = keep;
}

loadProjects();
</script>
</body>
</html>
