<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>osf agents</title>
<link rel="icon" href="data:,">
<style>
/* Dark-first tokens (default); light overrides under prefers-color-scheme: light. */
:root {
  color-scheme: dark;
  --bg: #0B1020;
  --bg-image: radial-gradient(1200px 600px at 20% -10%, rgba(99,102,241,.12), transparent 60%), radial-gradient(900px 500px at 100% 0%, rgba(34,197,94,.06), transparent 60%);
  --surface: #121A2B; --surface-2: #18223A; --surface-3: #1F2A44;
  --border: rgba(148,163,184,.14); --border-strong: rgba(148,163,184,.28);
  --text: #F1F5F9; --muted: #94A3B8; --faint: #64748B;
  --accent: #818CF8; --accent-tint: rgba(129,140,248,.14);
  --running: #22C55E; --running-tint: rgba(34,197,94,.14);
  --done: #4ADE80; --cut: #FB923C; --stalled: #FACC15; --loop: #C084FC; --pending-ring: #475569;
  --on-done: #0B1020;
  --tint-done: rgba(74,222,128,.14); --tint-cut: rgba(251,146,60,.14); --tint-stalled: rgba(250,204,21,.14);
  --glow-run: 0 0 0 1px rgba(34,197,94,.35), 0 0 18px rgba(34,197,94,.28);
  --glow-accent: 0 0 0 1px rgba(129,140,248,.4), 0 0 22px rgba(129,140,248,.30);
  --shadow-card: 0 1px 0 rgba(255,255,255,.04) inset, 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg: 0 1px 0 rgba(255,255,255,.04) inset, 0 24px 64px rgba(0,0,0,.55);
  --header-bg: rgba(11,16,32,.72);
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-back: cubic-bezier(.34, 1.56, .64, 1);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", "SF Mono", Consolas, monospace;
  --gutter: 24px;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #F6F7FB;
    --bg-image: radial-gradient(1200px 600px at 20% -10%, rgba(99,102,241,.05), transparent 60%);
    --surface: #FFFFFF; --surface-2: #F1F4F9; --surface-3: #E8EDF5;
    --border: #E2E8F0; --border-strong: #CBD5E1;
    --text: #0F172A; --muted: #475569; --faint: #94A3B8;
    --accent: #4F46E5; --accent-tint: #EEF0FF;
    --running: #15803D; --running-tint: #EEF8F1;
    --done: #15803D; --cut: #C2410C; --stalled: #A16207; --loop: #9333EA; --pending-ring: #94A3B8;
    --on-done: #FFFFFF;
    --tint-done: #EEF8F1; --tint-cut: #FFF1E8; --tint-stalled: #FDF6E0;
    --glow-run: 0 0 0 1px rgba(21,128,61,.30), 0 2px 8px rgba(21,128,61,.16);
    --glow-accent: 0 0 0 1px rgba(79,70,229,.30), 0 2px 10px rgba(79,70,229,.18);
    --shadow-card: 0 1px 2px rgba(15,23,42,.06), 0 4px 12px rgba(15,23,42,.06);
    --shadow-lg: 0 12px 32px rgba(15,23,42,.16);
    --header-bg: rgba(246,247,251,.78);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg-image), var(--bg); background-attachment: fixed; color: var(--text); font: 14px/1.5 var(--font); min-height: 100vh; overflow-x: hidden; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
button { font: inherit; color: inherit; }

/* ---------- header ---------- */
.top { position: sticky; top: 0; z-index: 20; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 var(--gutter); background: var(--header-bg); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.brand { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.brand .gem { color: var(--accent); font-size: 16px; }
.top select { height: 32px; min-width: 0; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); color: var(--text); font: inherit; font-size: 13px; cursor: pointer; transition: border-color .15s, background-color .15s; }
.top select:hover { border-color: var(--border-strong); background: var(--surface-2); }
#project { flex: 0 1 200px; }
#session { flex: 0 1 420px; }
/* fixed-width slot: "Live" and "Mất kết nối" swap without moving the header */
.live { margin-left: auto; width: 112px; flex: none; display: inline-flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.live::before { content: ""; width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--running); box-shadow: 0 0 0 3px var(--running-tint); }
.live[data-ok="false"] { color: var(--cut); }
.live[data-ok="false"]::before { background: var(--cut); box-shadow: 0 0 0 3px var(--tint-cut); }

main { max-width: 1240px; margin: 0 auto; padding: 28px var(--gutter) 56px; }
.alert { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; margin: 0 0 16px; border-radius: var(--r-md); border: 1px solid var(--tint-cut); background: var(--tint-cut); color: var(--cut); font-weight: 500; }
.alert button { margin-left: auto; height: 28px; padding: 0 12px; border: 1px solid currentColor; border-radius: 999px; background: transparent; cursor: pointer; transition: background-color .15s; }
.alert button:hover { background: var(--tint-cut); }
#content.stale { opacity: .6; }

/* ---------- hero ---------- */
.eyebrow { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hero h1 { margin: 0; min-height: 34px; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
.hero h1.swap { animation: heroswap .22s var(--ease-out); }
.hero[data-mode="finished"] h1 { color: var(--done); }
.hero[data-mode="stopped"] h1 { color: var(--stalled); }
.hero .meta { margin: 6px 0 0; min-height: 21px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- stepper ---------- */
.stepcard { margin-top: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-card); padding: 16px 20px 14px; }
.stepscroll { position: relative; }
.stepwrap { position: relative; }
.stepwrap.has-loop { padding-bottom: 44px; }
.stepper { list-style: none; margin: 0; padding: 0; display: flex; align-items: flex-start; }
.step { display: flex; align-items: flex-start; flex: 1 1 0; min-width: 0; }
.step:first-child { flex: 0 0 auto; }
.step:first-child > .conn { display: none; }
/* node = 24px pill row + 80px dot area; connector sits on the dot centre line (24 + 40) */
.conn { --c: var(--border-strong); flex: 1 1 auto; min-width: 12px; height: 2px; margin-top: 63px; border-radius: 2px; background: var(--c); position: relative; overflow: hidden; }
.conn[data-conn="done"] { --c: var(--done); }
.conn[data-skip="true"] { background: repeating-linear-gradient(90deg, var(--c) 0 4px, transparent 4px 8px); opacity: .6; }
.conn[data-conn="flow"], .conn[data-conn="wait"] { height: 3px; margin-top: 62.5px; opacity: 1; background: color-mix(in srgb, var(--accent) 30%, var(--border-strong)); }
.conn[data-conn="flow"]::after, .conn[data-conn="wait"]::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--accent), transparent) no-repeat; background-size: 40px 100%; background-position: -40px 0; animation: lightx 1.6s linear infinite; }
.conn[data-conn="wait"]::after { opacity: .55; animation-duration: 3.2s; }
.conn.just-done { background: var(--border-strong); }
.conn.just-done::before { content: ""; position: absolute; inset: 0; background: var(--done); transform-origin: left center; animation: grow .48s var(--ease-out) .12s both; }
.node { appearance: none; position: relative; border: 0; background: none; cursor: pointer; flex: none; width: 104px; min-height: 44px; padding: 24px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; border-radius: var(--r-md); scroll-snap-align: center; transition: background-color .18s; }
.node:hover { background: color-mix(in srgb, var(--surface-3) 55%, transparent); }
.dots { height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.dot { width: 32px; height: 32px; flex: none; border-radius: 50%; display: grid; place-items: center; position: relative; background: var(--surface); border: 2px solid var(--pending-ring); color: var(--muted); transition: width .25s var(--ease-out), height .25s var(--ease-out), background-color .25s, border-color .25s, box-shadow .25s; }
.dot .ico { width: 16px; height: 16px; }
.dot[data-state="done"] { background: var(--done); border-color: var(--done); color: var(--on-done); }
.dot[data-state="done"] .ico { stroke-width: 3; }
.dot[data-state="active"] { width: 44px; height: 44px; border: 2px solid var(--accent); background: var(--accent-tint); color: var(--accent); box-shadow: var(--glow-accent); }
.dot[data-state="active"] .ico { width: 20px; height: 20px; animation: spin 1s linear infinite; }
/* running node: slow breathing green glow (opacity only) */
.dot[data-state="active"]::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; box-shadow: var(--glow-run); opacity: 0; animation: breathe 2.4s ease-in-out infinite; pointer-events: none; }
.dot[data-state="waiting"] { width: 44px; height: 44px; border: 2px dashed var(--accent); background: var(--accent-tint); color: var(--accent); }
.dot[data-state="skipped"] { width: 18px; height: 18px; border: 1.5px dashed var(--pending-ring); background: transparent; opacity: .7; }
.dot[data-state="skipped"] .ico { width: 10px; height: 10px; }
.dot[data-state="cut"] { border-color: var(--cut); background: var(--tint-cut); color: var(--cut); }
.dot[data-state="stalled"] { border-color: var(--stalled); background: var(--tint-stalled); color: var(--stalled); }
.dot.just-done .ico path { stroke-dasharray: 24; animation: check .4s var(--ease-out) both; }
.node.bounce .dots { animation: bounce .3s var(--ease-out); }
.ntxt { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.pill { position: absolute; top: 2px; left: 50%; transform: translateX(-50%); height: 20px; padding: 0 8px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; color: var(--running); background: var(--running-tint); }
.pill:empty { display: none; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
.node[data-state="waiting"] .pill { color: var(--accent); background: var(--accent-tint); }
.node[data-state="waiting"] .pill::before { animation: none; background: transparent; border: 1.5px solid currentColor; }
.lbl { max-width: 104px; font-size: 13px; font-weight: 600; line-height: 1.3; text-align: center; color: var(--muted); }
.node[data-state="done"] .lbl { color: var(--text); }
.node[data-state="active"] .lbl, .node[data-state="waiting"] .lbl { color: var(--accent); }
.node[data-state="cut"] .lbl { color: var(--cut); }
.node[data-state="stalled"] .lbl { color: var(--stalled); }
.node[data-state="skipped"] .lbl { font-weight: 500; text-decoration: line-through; opacity: .8; }
.node[aria-pressed="true"] .lbl { text-decoration: underline 2px var(--accent); text-underline-offset: 4px; }
.node[aria-pressed="true"][data-state="skipped"] .lbl { text-decoration: line-through underline; }
.node:hover .dot:not([data-state="done"]):not([data-state="active"]):not([data-state="waiting"]) { border-color: var(--muted); }
/* caption row reserved even when empty */
.cap { min-height: 18px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12px; line-height: 18px; color: var(--muted); }
.cap .loopcap { color: var(--loop); font-weight: 600; }
.rmcap { display: none; font-size: 12px; font-weight: 600; color: var(--accent); }
.step.enter > .node, .step.enter > .conn { animation: nodein .32s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 40ms); }
.looparc { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.looparc .arc { fill: none; stroke: var(--loop); stroke-width: 1.5; }
.looparc .head { fill: var(--loop); }
.looparc text { fill: var(--loop); font: 600 12px var(--mono); }
.looparc.draw .arc { stroke-dasharray: var(--len); animation: draw .7s var(--ease-out) both; }
.looparc.draw .head, .looparc.draw text { animation: fadein .2s ease-out .6s both; }

/* ---------- agents ---------- */
.agents-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 28px; margin: 28px 0 12px; }
.agents-head h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.chip { height: 28px; padding: 0 12px; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; cursor: pointer; white-space: nowrap; transition: background-color .15s, border-color .15s; }
.chip:hover { background: var(--surface-3); border-color: var(--border-strong); }
#otherChip { margin-left: auto; min-width: 84px; justify-content: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.gridempty { margin: 0; padding: 8px 0; color: var(--muted); }
.prevhead { margin: 20px 0 10px; color: var(--faint); }
.prevgrid { opacity: .72; }
.prevgrid:empty { display: none; }
.agent { appearance: none; position: relative; width: 100%; min-width: 0; height: 102px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; text-align: left; cursor: pointer; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-card); transition: background-color .18s, border-color .18s; }
.agent::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent-c, transparent); transition: background-color .25s; }
.agent[data-status="running"] { --accent-c: var(--running); border-color: color-mix(in srgb, var(--running) 35%, var(--border)); animation: cardpulse 2.4s ease-in-out infinite; }
.agent[data-status="done"] { --accent-c: var(--done); }
.agent[data-status="cut"] { --accent-c: var(--cut); }
.agent[data-status="stalled"] { --accent-c: var(--stalled); }
.agent:hover { background: var(--surface-3); border-color: var(--border-strong); }
.agent[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: -1px; }
.agent[aria-pressed="true"]:focus-visible { outline-offset: 2px; }
.agent.enter { animation: enter .38s var(--ease-back) both; animation-delay: calc(var(--i, 0) * 60ms); }
.agent[data-status="running"].enter { animation: enter .38s var(--ease-back) both, cardpulse 2.4s ease-in-out infinite; animation-delay: calc(var(--i, 0) * 60ms), 0s; }
.l1 { height: 22px; display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; }
.l1 .ico { color: var(--sc, var(--muted)); }
.agent[data-status="running"] .l1 .ico { --sc: var(--running); animation: spin 1s linear infinite; }
.agent[data-status="done"] .l1 .ico { --sc: var(--done); }
.agent[data-status="cut"] .l1 .ico { --sc: var(--cut); }
.agent[data-status="stalled"] .l1 .ico { --sc: var(--stalled); }
.desc { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.l2 { height: 21px; display: flex; align-items: baseline; gap: 6px; min-width: 0; overflow: hidden; white-space: nowrap; }
.l2 .verb { flex: 0 0 auto; max-width: 65%; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 500; font-variant-numeric: tabular-nums; }
.l2 .obj { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: var(--muted); }
.tick { animation: tick .16s ease-out; }
.l3 { height: 18px; margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; line-height: 18px; color: var(--muted); white-space: nowrap; }
.l3 [data-ago] { font-family: var(--mono); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
.l3 .open { color: var(--accent); font-weight: 500; }

/* ---------- badge ---------- */
.badge { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 76px; height: 24px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.badge[data-status="running"] { background: var(--running-tint); color: var(--running); }
.badge[data-status="running"] .ico { animation: spin 1s linear infinite; }
.badge[data-status="done"] { background: var(--tint-done); color: var(--done); }
.badge[data-status="cut"] { background: var(--tint-cut); color: var(--cut); }
.badge[data-status="stalled"] { background: var(--tint-stalled); color: var(--stalled); }
.badge .ico { width: 14px; height: 14px; }

/* ---------- drawer ---------- */
.drawer { position: fixed; z-index: 30; top: 56px; right: 0; bottom: 0; width: 400px; max-width: 100vw; padding: 20px; overflow-y: auto; background: var(--surface); border-left: 1px solid var(--border-strong); box-shadow: var(--shadow-lg); transform: translateX(100%); opacity: .6; visibility: hidden; transition: transform .18s cubic-bezier(.4, 0, 1, 1), opacity .18s cubic-bezier(.4, 0, 1, 1), visibility 0s linear .18s; }
.drawer[data-open="true"] { transform: none; opacity: 1; visibility: visible; transition: transform .28s var(--ease-out), opacity .28s var(--ease-out), visibility 0s; }
.grab { display: none; }
.dhead { display: flex; align-items: flex-start; gap: 12px; }
.dhead h2 { flex: 1; min-width: 0; margin: 4px 0 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; overflow-wrap: anywhere; }
.iconbtn { width: 44px; height: 44px; margin: -6px -10px 0 0; flex: none; display: grid; place-items: center; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--muted); cursor: pointer; transition: background-color .15s, color .15s; }
.iconbtn:hover { background: var(--surface-3); color: var(--text); }
.iconbtn .ico { width: 20px; height: 20px; }
.dsub { margin: 8px 0 0; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted); }
.dtype { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
.box { margin-top: 16px; padding: 14px 14px 14px 16px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border); }
.box[data-kind="running"] { box-shadow: inset 3px 0 0 var(--running); }
.bverb { margin: 0; min-height: 24px; font-size: 16px; font-weight: 600; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.box[data-kind="done"] .bverb { color: var(--done); }
.box[data-kind="cut"] .bverb { color: var(--cut); }
.box[data-kind="stalled"] .bverb { color: var(--stalled); }
.bobj { margin: 4px 0 0; font-size: 13px; overflow-wrap: anywhere; }
.bobj.prose { font-family: var(--font); font-size: 14px; }
.bago { margin: 6px 0 0; min-height: 18px; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
.recentwrap { margin-top: 20px; }
.recent { list-style: none; margin: 0; padding: 0; }
.recent li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: baseline; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.recent li:last-child { border-bottom: 0; }
.recent .o { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--muted); }
.recent .t { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); white-space: nowrap; }
.olist { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.oitem { appearance: none; width: 100%; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; text-align: left; cursor: pointer; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); transition: background-color .18s, border-color .18s; }
.oitem:hover { background: var(--surface-3); border-color: var(--border-strong); }
.oitem .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.oitem .ot { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oitem .od { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- states ---------- */
.skel { background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
/* skeleton mirrors the final layout: hero 34 + meta 21, stepper row, agents head + cards */
.skelline { width: 240px; height: 34px; border-radius: var(--r-sm); }
.skelmeta { width: 160px; height: 14px; margin-top: 13px; border-radius: 4px; }
.skelrow { display: flex; align-items: flex-start; gap: 12px; height: 151px; padding-top: 48px; }
.skelrow .sd { width: 32px; height: 32px; border-radius: 50%; flex: none; }
.skelrow .sl { height: 2px; flex: 1; margin-top: 15px; }
.skelhead { margin: 28px 0 12px; min-height: 28px; display: flex; align-items: center; }
.skeltext { margin: 0; color: var(--muted); }
.skelcard { height: 102px; border-radius: var(--r-md); border: 1px solid var(--border); }
.empty { padding: 72px 16px; text-align: center; color: var(--muted); }
.empty .ico { width: 32px; height: 32px; color: var(--accent); }
.empty h2 { margin: 12px 0 4px; font-size: 16px; font-weight: 700; color: var(--text); }
.empty p { margin: 0; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes lightx { from { background-position: -40px 0; } to { background-position: calc(100% + 40px) 0; } }
@keyframes lighty { from { background-position: 0 -40px; } to { background-position: 0 calc(100% + 40px); } }
@keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.8); } }
@keyframes check { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes growy { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
@keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes enter { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes nodein { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
@keyframes heroswap { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes cardpulse { 0%, 100% { box-shadow: var(--shadow-card); } 50% { box-shadow: var(--shadow-card), var(--glow-run); } }
@keyframes tick { from { opacity: .4; } to { opacity: 1; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* tablet: horizontal stepper scrolls inside its card */
@media (max-width: 1023px) {
  .stepscroll { overflow-x: auto; scroll-snap-type: x proximity; }
  .stepper { min-width: max-content; }
  .step, .step:first-child { flex: 0 0 auto; }
  .conn { flex: 0 0 32px; }
  .looparc { display: none; }
  .stepwrap.has-loop { padding-bottom: 0; }
  .drawer { width: 360px; }
}
/* phone: vertical stepper, current step's agents inline, drawer as bottom sheet */
@media (max-width: 719px) {
  :root { --gutter: 16px; }
  .brand .name { display: none; }
  .top { gap: 8px; }
  .live { font-size: 0; gap: 0; width: 16px; }
  .hero h1 { font-size: 24px; min-height: 29px; }
  .stepscroll { overflow: visible; }
  .stepper { flex-direction: column; min-width: 0; }
  .step, .step:first-child { flex-direction: column; align-items: stretch; }
  .conn { flex: none; width: 2px; height: 16px; min-width: 0; margin: 0 0 0 35px; }
  .conn[data-skip="true"] { background: repeating-linear-gradient(180deg, var(--c) 0 4px, transparent 4px 8px); }
  .conn[data-conn="flow"], .conn[data-conn="wait"] { width: 3px; height: 16px; margin: 0 0 0 34.5px; }
  .conn[data-conn="flow"]::after, .conn[data-conn="wait"]::after { background-image: linear-gradient(180deg, transparent, var(--accent), transparent); background-size: 100% 40px; background-position: 0 -40px; animation-name: lighty; }
  .conn.just-done::before { transform-origin: center top; animation-name: growy; }
  .node { width: 100%; flex-direction: row; align-items: center; gap: 12px; padding: 0; }
  .node:hover { background: none; }
  .dots { height: auto; min-height: 48px; width: 72px; flex: none; flex-direction: row; }
  .ntxt { align-items: flex-start; }
  .pill { position: static; transform: none; align-self: flex-start; margin-bottom: 2px; }
  .lbl { max-width: none; text-align: left; }
  .cap { justify-content: flex-start; min-height: 0; }
  .slot:not(:empty) { padding: 8px 0 12px; }
  .slot .agents-head { margin-top: 4px; }
  .skelrow { flex-direction: column; height: auto; padding: 8px 0 8px 20px; gap: 0; }
  .skelrow .sl { flex: none; width: 2px; height: 16px; margin: 0 0 0 15px; }
  .skelrow .sd { margin: 8px 0; }
  .drawer { top: auto; left: 0; right: 0; width: auto; max-height: 85vh; border-left: 0; border-top: 1px solid var(--border-strong); border-radius: var(--r-lg) var(--r-lg) 0 0; transform: translateY(100%); }
  .drawer[data-open="true"] { transform: none; }
  .grab { display: block; width: 36px; height: 4px; margin: -8px auto 12px; border-radius: 2px; background: var(--border-strong); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  /* static cues stay: accent glow ring on the active node, green ring on running cards, solid flow track */
  .dot[data-state="active"]::after { display: none; }
  .conn[data-conn="flow"]::after, .conn[data-conn="wait"]::after { display: none; }
  .conn[data-conn="flow"] { background: var(--accent); }
  .conn[data-conn="wait"] { background: color-mix(in srgb, var(--accent) 55%, transparent); }
  .agent[data-status="running"] { box-shadow: var(--shadow-card), var(--glow-run); }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="gem" aria-hidden="true">◆</span><span class="name">osf agents</span></div>
  <label class="sr-only" for="project">Project</label>
  <select id="project"></select>
  <label class="sr-only" for="session">Session</label>
  <select id="session"></select>
  <span class="live" id="live" role="status" data-ok="true">Live</span>
</header>
<main id="main">
  <div id="alert"></div>
  <section id="loading" aria-busy="true">
    <p class="eyebrow">ĐANG Ở BƯỚC</p>
    <div class="skel skelline"></div>
    <div class="skel skelmeta"></div>
    <div class="stepcard">
      <div class="skelrow" aria-hidden="true">
        <span class="sd skel"></span><span class="sl skel"></span><span class="sd skel"></span><span class="sl skel"></span>
        <span class="sd skel"></span><span class="sl skel"></span><span class="sd skel"></span><span class="sl skel"></span>
        <span class="sd skel"></span><span class="sl skel"></span><span class="sd skel"></span><span class="sl skel"></span><span class="sd skel"></span>

  <div id="content" hidden>

    <section class="stepcard" id="stepCard" aria-label="Pipeline">

</main>
<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="drawerTitle" data-open="false" inert>
  <div class="grab" aria-hidden="true"></div>
  <div class="dhead">
    <h2 id="drawerTitle"></h2>
    <button type="button" class="iconbtn" id="drawerClose" aria-label="Đóng"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
  <div id="dAgent">
    <button type="button" class="chip" id="dBack" hidden>← Danh sách</button>
    <p class="dsub"><span id="dBadge"></span><span id="dStep"></span></p>
    <p class="dtype mono" id="dType"></p>
    <section class="box" id="dBox" aria-live="polite">
      <p class="eyebrow" id="dBoxHead"></p>
      <p class="bverb" id="dVerb"></p>

      <p class="eyebrow">VỪA LÀM</p>
      <ol class="recent" id="dRecent"></ol>
    </section>
  </div>
  <div id="dOthers" hidden><ul class="olist" id="dOtherList"></ul></div>
</aside>
<div class="sr-only" id="announcer" role="status" aria-atomic="true"></div>
<script>
'use strict';
// Icons: SVG paths from Lucide (https://lucide.dev), ISC License,
// Copyright (c) Lucide Contributors. Static constants only — never user text.
const ICONS = {
  running: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
  done: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  cut: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  stalled: '<circle cx="12" cy="12" r="10"/><line x1="10" x2="10" y1="15" y2="9"/><line x1="14" x2="14" y1="15" y2="9"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  minus: '<path d="M5 12h14"/>',
};
const DOT_ICON = { done: 'check', active: 'running', cut: 'cut', stalled: 'stalled', skipped: 'minus' };
const STATUS_LABEL = { running: 'Đang chạy', done: 'Xong', cut: 'Bị cắt', stalled: 'Treo' };
const NODE_TEXT = { done: 'xong', active: 'đang chạy', waiting: 'đang chờ', pending: 'chưa tới', skipped: 'bỏ qua', cut: 'bị cắt', stalled: 'treo' };
const STATUS_RANK = { running: 0, stalled: 1, cut: 2, done: 3 };
const SVG_NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
const phone = matchMedia('(max-width: 719px)');
const wide = matchMedia('(min-width: 1024px)');
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
// The agents block moves into a stepper slot on phone and can be detached while
// the stepper rebuilds, so its elements are held here, never looked up by id.
const AB = {
  block: $('agentsBlock'), home: $('agentsHome'), title: $('gridTitle'), back: $('backBtn'), other: $('otherChip'),
  grid: $('grid'), empty: $('gridEmpty'), prevHead: $('prevHead'), prevGrid: $('prevGrid'),
};
function homeAgentsBlock() {
  if (AB.block.parentNode === AB.home) return;
  const focused = document.activeElement;
  AB.home.append(AB.block);
  if (focused && focused !== document.activeElement && AB.block.contains(focused)) focused.focus({ preventScroll: true });
}

const S = {
  project: null, sessions: [], sessionsLoaded: false, sessionsSig: '', sessionId: null, data: null, es: null, sessTimer: null,
  connOk: true, viewPos: null, drawer: null, opener: null,
  cards: new Map(), byKey: new Map(), byId: new Map(), stepBy: {}, positions: [], stepSig: '', nodes: new Map(),
  loopCount: -1, curSig: '', warnSig: '', recentSig: '', othersSig: '', ann: null,
};

// ---------- small helpers ----------
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : String(v));
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return n;
}
function icon(name, cls = 'ico') {
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('class', cls);
  svg.setAttribute('aria-hidden', 'true');
  setIcon(svg, name);
  return svg;
}
function setIcon(svg, name) {
  if (svg.dataset.icon === (name || '')) return;
  svg.dataset.icon = name || '';
  svg.innerHTML = ICONS[name] || ''; // static constant markup only
}
function setText(node, text) {
  const t = text == null ? '' : String(text);
  if (node.textContent !== t) node.textContent = t;
}
function setAttr(node, k, v) {
  if (v == null) { if (node.hasAttribute(k)) node.removeAttribute(k); }
  else if (node.getAttribute(k) !== String(v)) node.setAttribute(k, String(v));
}
function replay(node, cls) {
  node.classList.remove(cls);
  void node.offsetWidth; // restart the CSS animation
  node.classList.add(cls);
}
const msOf = (iso) => { const n = Date.parse(iso || ''); return Number.isNaN(n) ? null : n; };
function dur(ms) {
  const s = Math.max(0, Math.round((ms || 0) / 1000));
  if (s < 60) return `${s} giây`;
  const m = Math.round(s / 60);
  if (m < 60) return `${m} phút`;
  const h = Math.floor(m / 60);
  if (h >= 24) return `${Math.floor(h / 24)} ngày`;
  return m % 60 ? `${h} giờ ${m % 60} phút` : `${h} giờ`;
}
function ago(iso) {
  const t = msOf(iso);
  if (t == null) return '';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 5) return 'vừa xong';
  if (s < 60) return `${Math.floor(s)} giây trước`;
  if (s < 3600) return `${Math.floor(s / 60)} phút trước`;
  if (s < 86400) return `${Math.floor(s / 3600)} giờ trước`;
  return new Date(t).toLocaleDateString('vi-VN');
}
const hhmm = (iso) => { const t = msOf(iso); return t == null ? '' : new Date(t).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false }); };
const keyOf = (a) => a.parentToolUseId || a.id;
const shortType = (t) => String(t || '').replace(/^osf:/, '');
const isBusy = (a) => a.status === 'running' || a.status === 'stalled';
const newest = (x, y) => String(y.startedAt || '').localeCompare(String(x.startedAt || ''));
const byStatus = (x, y) => (STATUS_RANK[x.status] ?? 9) - (STATUS_RANK[y.status] ?? 9) || newest(x, y);
const posOf = (k) => (k === 'security' || k === 'verify' ? 'gates' : k);
async function getJson(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${r.status}`);
  return r.json();
}
function badge(status) {
  const b = el('span', { class: 'badge' }, icon(status), el('span', null));
  setBadge(b, status);
  return b;
}
function setBadge(b, status) {
  setAttr(b, 'data-status', status);
  setIcon(b.firstChild, status);
  setText(b.lastChild, STATUS_LABEL[status] || status);
}

// ---------- connection state ----------
function setConn(ok, retry) {
  S.connOk = ok;
  const live = $('live');
  setAttr(live, 'data-ok', ok ? 'true' : 'false');
  setText(live, ok ? 'Live' : 'Mất kết nối');
  $('content').classList.toggle('stale', !ok);
  const box = $('alert');
  if (ok) { box.replaceChildren(); return; }
  if (box.firstChild) return;
  box.append(el('div', { class: 'alert', role: 'alert' }, icon('cut'),
    el('span', null, 'Mất kết nối tới server agents. Đang thử lại…'),
    el('button', { type: 'button', onclick: retry || reconnect }, 'Thử lại')));
}
function reconnect() {
  if (!S.project) { loadProjects(); return; }
  loadSessions();
  if (S.sessionId) openStream(S.sessionId);
}

// ---------- projects & sessions ----------
// Last two dash parts of each project dir; duplicates take more parts until unique.
function projectLabels(names) {
  const parts = names.map((n) => n.split('-').filter(Boolean));
  const take = names.map(() => 2);
  const lab = (i) => parts[i].slice(-take[i]).join('-') || names[i];
  for (;;) {
    const labels = names.map((_, i) => lab(i));
    const dup = new Set(labels.filter((l, i) => labels.indexOf(l) !== i));
    let grew = false;
    labels.forEach((l, i) => { if (dup.has(l) && take[i] < parts[i].length) { take[i]++; grew = true; } });
    if (!grew) return labels;
  }
}

async function loadProjects() {
  try {
    const { projects, defaultProject } = await getJson('/api/projects');
    const sel = $('project');
    const labels = projectLabels(projects.map((p) => p.name));
    sel.replaceChildren(...projects.map((p, i) => el('option', { value: p.name, title: p.name }, labels[i])));
    const hash = new URLSearchParams(location.hash.slice(1));
    const want = hash.get('project') || defaultProject;
    S.project = projects.some((p) => p.name === want) ? want : (projects[0] && projects[0].name) || null;
    if (S.project) { sel.value = S.project; sel.title = S.project; }
    setConn(true);
    await loadSessions(hash.get('id'));
  } catch {
    setConn(false, () => { $('alert').replaceChildren(); loadProjects(); });
  }
}
function switchProject(name, wantId) {
  const sel = $('project');
  S.project = name;
  sel.value = name;
  sel.title = name;
  closeDrawer(false);
  S.sessionId = null; S.sessions = []; S.sessionsLoaded = false; S.sessionsSig = '';
  closeStream(); resetView(); S.data = null; renderAll();
  loadSessions(wantId);
}
$('project').addEventListener('change', (e) => switchProject(e.target.value));
$('session').addEventListener('change', (e) => selectSession(e.target.value));
// Editing the URL hash switches project / session without a reload.
window.addEventListener('hashchange', () => {
  const hash = new URLSearchParams(location.hash.slice(1));
  const project = hash.get('project');
  const id = hash.get('id');
  if (project && project !== S.project) {
    if ([...$('project').options].some((o) => o.value === project)) switchProject(project, id);
  } else if (id && id !== S.sessionId && S.sessions.some((s) => s.id === id)) {
    selectSession(id);
  }
});

async function loadSessions(wantId) {
  clearTimeout(S.sessTimer);
  if (!S.project) { S.sessionsLoaded = true; renderAll(); return; }
  const project = S.project;
  try {
    const { sessions } = await getJson(`/api/sessions?project=${encodeURIComponent(project)}`);
    if (project !== S.project) return;
    S.sessions = sessions.filter((s) => s.agentCount > 0);
    S.sessionsLoaded = true;
    renderSessionSelect();
    if (!S.sessions.length) {
      closeStream(); resetView(); S.sessionId = null; S.data = null; renderAll();
    } else if (!S.sessionId || !S.sessions.some((s) => s.id === S.sessionId)) {
      selectSession(wantId && S.sessions.some((s) => s.id === wantId) ? wantId : S.sessions[0].id);
    }
  } catch {
    setConn(false);
  }
  S.sessTimer = setTimeout(() => loadSessions(), 10000);
}
function sessionLabel(s) {
  let t = (s.title || s.id).replace(/\s+/g, ' ').trim();
  if (t.length > 48) t = t.slice(0, 47) + '…';
  return s.anyRunning ? `${t} · đang chạy` : t;
}
function renderSessionSelect() {
  const sel = $('session');
  const sig = S.sessions.map((s) => `${s.id}|${s.title}|${s.anyRunning}`).join('\n');
  if (sig !== S.sessionsSig) {
    S.sessionsSig = sig;
    sel.replaceChildren(...S.sessions.map((s) => el('option', { value: s.id, title: s.title || s.id }, sessionLabel(s))));
  }
  if (S.sessionId) sel.value = S.sessionId;
  const cur = S.sessions.find((s) => s.id === S.sessionId);
  sel.title = cur ? (cur.title || cur.id) : '';
}

// ---------- stream ----------
function closeStream() { if (S.es) { S.es.close(); S.es = null; } }
function selectSession(id) {
  if (S.sessionId !== id) { closeDrawer(false); resetView(); S.data = null; }
  S.sessionId = id;
  history.replaceState(null, '', `#project=${encodeURIComponent(S.project)}&id=${encodeURIComponent(id)}`);
  renderSessionSelect();
  renderAll();
  openStream(id);
}
function openStream(id) {
  closeStream();
  const es = new EventSource(`/api/events?project=${encodeURIComponent(S.project)}&id=${encodeURIComponent(id)}`);
  S.es = es;
  es.onopen = () => setConn(true);
  es.addEventListener('session', (ev) => {
    if (S.es !== es) return;
    let d;
    try { d = JSON.parse(ev.data); } catch { return; }
    setConn(true);
    if (d.error) { loadSessions(); return; }
    S.data = d;
    logWarnings(d);
    renderAll();
  });
  es.onerror = () => { if (S.es === es) setConn(false); };
}
function logWarnings(d) {
  const w = d.warnings || {};
  const sig = `${d.id}|${w.malformedLines}|${w.badMeta}|${w.truncated}|${w.unlinkedAgents}`;
  if (sig === S.warnSig) return;
  S.warnSig = sig;
  if (w.malformedLines || w.badMeta || w.truncated || w.unlinkedAgents) console.info('osf agents: parse warnings', w);
}

// ---------- view ----------
function resetView() {
  for (const c of S.cards.values()) c.remove();
  S.cards.clear();
  homeAgentsBlock(); // before the stepper (and the slot holding the block) is cleared
  $('stepper').replaceChildren();
  S.nodes.clear(); S.positions = []; S.stepSig = ''; S.loopCount = -1; S.curSig = ''; S.viewPos = null;

// ---------- hero ----------
function renderHero(d, p) {
  let mode, eyebrow, title, meta, stepLabel = '';
  const agents = d.agents;
  if (p.kind === 'none') {
    const r = agents.filter((a) => a.status === 'running').length;
    mode = 'none'; eyebrow = 'SESSION'; title = 'Agent trong session';
    meta = `${agents.length} agent${r ? ` · ${r} đang chạy` : ''}`;
  } else if (p.finished) {
    const done = p.steps.filter((s) => s.state === 'done').length;
    const starts = agents.map((a) => msOf(a.startedAt)).filter((x) => x != null);
    const ends = agents.map((a) => msOf(a.endedAt || a.lastActivityAt)).filter((x) => x != null);
    mode = 'finished'; eyebrow = 'PIPELINE'; title = '✓ Hoàn tất';
    meta = `${done} bước${starts.length && ends.length ? ` · ${dur(Math.max(...ends) - Math.min(...starts))}` : ''}`;
  } else if (p.stopped) {
    const pos = buildPositions(p).find((x) => x.id === posOf(p.stoppedAt));
    const last = Math.max(msOf(d.updatedAt) ?? -Infinity, ...agents.map((a) => msOf(a.lastActivityAt) ?? -Infinity));
    stepLabel = pos ? pos.label : p.stoppedAt || '—';
    mode = 'stopped'; eyebrow = 'ĐÃ DỪNG'; title = `Dừng ở bước ${stepLabel}`;
    meta = Number.isFinite(last) ? `không hoạt động ${dur(Date.now() - last)}` : '';
  } else {
    const cur = p.steps.filter((s) => p.current.includes(s.key));
    const label = cur.map((s) => s.label).join(' ‖ ');
    stepLabel = cur.map((s) => s.label).join(' và ');
    eyebrow = 'ĐANG Ở BƯỚC';
    if ((cur.length && cur.every((s) => s.state === 'waiting')) || (!cur.length && p.waiting)) {
      mode = 'waiting'; title = 'Đang chờ bước tiếp theo';
      meta = cur.length ? `Tiếp theo: ${label}` : 'Đang chờ agent tiếp theo';
    } else {
      mode = 'active'; title = label || '—';
      const ids = cur.flatMap((s) => s.agentIds).map((id) => S.byId.get(id)).filter(Boolean);
      const running = ids.filter((a) => a.status === 'running').length;
      const stalled = ids.filter((a) => a.status === 'stalled').length;
      const parts = [];
      if (running) parts.push(`${running} agent đang chạy`);
      else if (stalled) parts.push(`${stalled} agent treo`);
      else if (!ids.length) parts.push('chưa gọi agent');
      if (p.round > 1) parts.push(`vòng ${p.round}`);
      const start = cur.map((s) => msOf(s.startedAt)).filter((x) => x != null);
      if (start.length) parts.push(dur(Date.now() - Math.min(...start)));
      meta = parts.join(' · ');
    }
  }
  setAttr($('hero'), 'data-mode', mode);
  setText($('heroEyebrow'), eyebrow);
  const h = $('heroTitle');
  if (h.textContent !== title) {
    const first = !h.textContent;
    h.textContent = title;
    if (!first) replay(h, 'swap');
  }
  setText($('heroMeta'), meta);

}

}
function renderDrawer() {
  if (!S.drawer || !S.data) return;
  const others = S.drawer.mode === 'others';
  $('dAgent').hidden = others;
  $('dOthers').hidden = !others;
  if (others) {
    const ids = (S.data.pipeline && S.data.pipeline.otherAgentIds) || [];
    const list = ids.map((id) => S.byId.get(id)).filter(Boolean).sort(byStatus);
    setText($('drawerTitle'), `Agent khác (${list.length})`);
    const sig = list.map((a) => `${keyOf(a)}|${a.status}|${a.description}`).join('\n');
    if (sig !== S.othersSig) {
      S.othersSig = sig;
      $('dOtherList').replaceChildren(...list.map((a) => el('li', null,
        el('button', { type: 'button', class: 'oitem', onclick: () => openDrawer({ mode: 'agent', key: keyOf(a), fromOthers: true }, { chip: true }) },
          el('span', { class: 'row' }, el('span', { class: 'ot mono' }, shortType(a.type)), badge(a.status)),
          el('span', { class: 'od' }, a.description || shortType(a.type))))));
    }
    return;
  }
  const a = S.byKey.get(S.drawer.key);
  if (!a) { closeDrawer(false); return; }
  $('dBack').hidden = !S.drawer.fromOthers;
  setText($('drawerTitle'), a.description || shortType(a.type));
  const bh = $('dBadge');
  if (!bh.firstChild) bh.append(badge(a.status)); else setBadge(bh.firstChild, a.status);
  setText($('dStep'), stepLabelOf(a));
  setText($('dType'), shortType(a.type));

  const box = $('dBox');
  const verbEl = $('dVerb');
  const objEl = $('dObj');
  const agoEl = $('dAgo');
  let head, verb, obj = '', prose = false, agoIso = null, kind = a.status;
  if (a.status === 'done') {
    const s = msOf(a.startedAt);
    const e = msOf(a.endedAt || a.lastActivityAt);
    head = 'KẾT QUẢ';
    verb = `✓ Xong${a.endedAt ? ` lúc ${hhmm(a.endedAt)}` : ''}${s != null && e != null ? ` · ${dur(e - s)}` : ''}`;
    obj = a.resultLine || '';
    prose = true;
  } else if (a.status === 'cut') {
    head = 'KẾT QUẢ';
    verb = `⚠ Bị cắt — ${a.statusReason || 'không rõ lý do'}`;
    agoIso = a.lastActivityAt;
  } else {
    const l = a.doingNowLabel || { verb: 'Đang chạy', object: '' };
    const last = a.toolTimeline && a.toolTimeline[a.toolTimeline.length - 1];
    head = 'ĐANG LÀM';
    verb = l.verb;
    obj = l.object || '';
    agoIso = (last && last.ts) || a.lastActivityAt || a.startedAt;
    if (a.status === 'stalled') head = 'ĐANG LÀM · KHÔNG HOẠT ĐỘNG';
  }
  setAttr(box, 'data-kind', kind);
  setText($('dBoxHead'), head);
  const sig = `${S.drawer.key}|${verb}|${obj}`;
  if (box.dataset.sig !== sig) {
    const same = box.dataset.sig && box.dataset.sig.startsWith(`${S.drawer.key}|`);
    box.dataset.sig = sig;
    setText(verbEl, verb);
    setText(objEl, obj);
    if (same) replay(verbEl, 'tick');
  }
  objEl.hidden = !obj;
  objEl.classList.toggle('prose', prose);
  objEl.classList.toggle('mono', !prose);
  agoEl.hidden = !agoIso;
  setAttr(agoEl, 'data-ago', agoIso || '');
  setText(agoEl, agoIso ? ago(agoIso) : '');

  const tl = a.toolTimeline || [];
  const items = (isBusy(a) ? tl.slice(0, -1) : tl).slice(-5).reverse();
  const rsig = `${S.drawer.key}|${items.map((t) => `${t.ts}|${t.tool}|${t.target}`).join('\n')}`;
  if (rsig !== S.recentSig) {
    S.recentSig = rsig;
    $('dRecent').replaceChildren(...items.map((t) => {
      const l = t.label || { verbPast: t.tool, object: t.target || '' };
      return el('li', null, el('span', { class: 'v' }, l.verbPast), el('span', { class: 'o mono', title: l.object }, l.object),
        el('span', { class: 't', 'data-ago': t.ts || '' }, ago(t.ts)));
    }));
  }
  $('dRecentWrap').hidden = !items.length;
}

// ---------- live clock ----------
setInterval(() => {
  for (const n of document.querySelectorAll('[data-ago]')) {
    const iso = n.getAttribute('data-ago');
    if (iso) setText(n, ago(iso));
  }
}, 1000);
const relayout = () => { if (S.data) renderContent(S.data); };
phone.addEventListener('change', relayout);
wide.addEventListener('change', relayout);
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (S.data && S.data.pipeline && S.data.pipeline.kind !== 'none') drawLoop(S.data.pipeline); }, 120);
});

loadProjects();
</script>
