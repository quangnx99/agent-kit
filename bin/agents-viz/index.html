<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-kit</title>
<link rel="icon" href="data:,">
<style>
/* Tokens: flat, one font, follows the system light/dark setting. */
:root {
  color-scheme: light;
  --bg: #f4f4f6; --surface: #ffffff; --surface-overlay: #ffffff;
  --item-hover: #f4f4f6; --selected: #ececf0;
  --border: #ececef; --border-strong: #dedee3;
  --text: #18181b; --muted: #52525b; --faint: #63636b;
  --accent: #4f46e5; --accent-bg: #eef0ff; --on-accent: #fff;
  --run: var(--accent); --run-bg: var(--accent-bg);
  --cut: #c70036; --cut-bg: #fff1f3;
  --stalled: #973c00; --stalled-bg: #fffbeb;
  --done: #71717a; --done-bg: #f4f4f5;
  --elevation: 0 20px 25px -5px rgb(0 0 0 / .1), 0 8px 10px -6px rgb(0 0 0 / .1);
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --r: 12px; --r-sm: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b0c12; --surface: #12141b; --surface-overlay: #191c25;
    --item-hover: rgb(255 255 255 / .05); --selected: rgb(255 255 255 / .09);
    --border: rgb(255 255 255 / .08); --border-strong: rgb(255 255 255 / .14);
    --text: #f1f2f6; --muted: #a8abb6; --faint: #8b8e99;
    --accent: #a5b4fc; --accent-bg: rgb(165 180 252 / .12); --on-accent: #0b0c12;
    --cut: #fb7185; --cut-bg: rgb(251 113 133 / .12);
    --stalled: #fbbf24; --stalled-bg: rgb(251 191 36 / .12);
    --done: #8b8e99; --done-bg: rgb(255 255 255 / .06);
    --elevation: 0 20px 25px -5px rgb(0 0 0 / .6), 0 8px 10px -6px rgb(0 0 0 / .6);
  }
}

/* Thin auto-hiding scrollbars */
* { --scrollbar-thumb: transparent; }
*:hover { --scrollbar-thumb: color-mix(in srgb, var(--text) 16%, transparent); }
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 9999px; }
::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--text) 40%, transparent); }
@supports not selector(::-webkit-scrollbar) { * { scrollbar-width: thin; scrollbar-color: transparent transparent; } *:hover { scrollbar-color: color-mix(in srgb, var(--text) 18%, transparent) transparent; } }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
/* Keyboard focus: no outer ring; the focused control takes the hover background (I13). */
:focus-visible { outline: none; }
.agent:focus-visible, .menu .opt:focus-visible, .picker > button:focus-visible, .btn:focus-visible, .icon-btn:focus-visible { background: var(--item-hover); }
.agent[aria-current="true"]:focus-visible, .menu .opt[aria-current="true"]:focus-visible { background: color-mix(in srgb, var(--text) 12%, transparent); }
.seg button:focus-visible { color: var(--text); background: color-mix(in srgb, var(--surface) 60%, transparent); }
.seg button[aria-current]:focus-visible { background: var(--surface); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico-sm { width: 14px; height: 14px; }

/* ===== App frame ===== */
.app { display: flex; flex-direction: column; height: 100dvh; }
.app-top { flex: none; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; }
.brand-mark { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: var(--text); color: var(--surface); font-size: 12px; font-weight: 700; }
.picker { position: relative; min-width: 0; }
.picker > button { display: flex; align-items: center; gap: 8px; height: 36px; max-width: 460px; padding: 0 10px 0 12px; border: 1px solid var(--border-strong); border-radius: var(--r-sm); background: var(--surface); cursor: pointer; }
.picker > button:hover { background: var(--item-hover); }
.picker .crumb { color: var(--faint); white-space: nowrap; }
.picker .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; width: min(420px, calc(100vw - 32px)); max-height: min(480px, calc(100dvh - 80px)); overflow-y: auto; padding: 4px; background: var(--surface-overlay); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--elevation); opacity: 0; visibility: hidden; translate: 0 -4px; pointer-events: none; transition: opacity .12s, translate .12s, visibility .12s; }
.picker[data-open] .menu { opacity: 1; visibility: visible; translate: 0 0; pointer-events: auto; }
.menu-label { padding: 6px 10px 4px; color: var(--faint); font-size: 12px; font-weight: 500; }
.menu .opt { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 6px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--text); text-align: left; cursor: pointer; }
.menu .opt + .opt { margin-top: 4px; }
.menu .opt:hover { background: var(--item-hover); }
.menu .opt[aria-current="true"] { background: var(--selected); }
.menu .opt .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu .opt .sub { margin-left: auto; color: var(--faint); font-size: 12px; white-space: nowrap; }
.live { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--run); }
.live[data-off] i { background: var(--cut); }

/* ===== Summary ===== */
.summary { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin-bottom: 20px; }
.summary h1 { margin: 0; font-size: 20px; font-weight: 600; line-height: 28px; }
.summary .meta { margin-top: 2px; color: var(--muted); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.counts:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; background: var(--done-bg); color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; }
.chip[data-st="run"] { background: var(--run-bg); color: var(--run); }
.chip[data-st="cut"] { background: var(--cut-bg); color: var(--cut); }
.chip[data-st="stalled"] { background: var(--stalled-bg); color: var(--stalled); }
.chip b { font-weight: 600; }

/* Round tabs */
.rounds { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 16px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 3px; border-radius: 10px; background: var(--selected); }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-weight: 500; white-space: nowrap; cursor: pointer; }
.seg button:hover { color: var(--text); }
.seg button[aria-current] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px rgb(0 0 0 / .04), 0 1px 2px rgb(0 0 0 / .08); }
.seg button .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cut); }
.seg button .dot[data-st="run"] { background: var(--run); }
.round-note { color: var(--muted); font-size: 13px; }

/* Status icon */
.st { display: inline-grid; place-items: center; width: 20px; height: 20px; flex: none; border-radius: 50%; }
.st[data-st="done"] { color: var(--done); }
.st[data-st="run"] { color: var(--run); }
.st[data-st="cut"] { color: var(--cut); }
.st[data-st="stalled"] { color: var(--stalled); }
.st[data-st="pending"] { color: var(--faint); }
.st[data-st="run"] .ico { animation: spin 1.4s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }

/* Agent row */
.agent { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 2px 10px; align-items: start; width: 100%; padding: 10px 12px; border: 0; border-radius: var(--r-sm); background: transparent; text-align: left; cursor: pointer; }
.agent:hover { background: var(--item-hover); }
.agent[aria-current="true"] { background: var(--selected); }
.agent .nm { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-weight: 500; line-height: 20px; overflow-wrap: anywhere; }
.agent .dur { color: var(--muted); font-size: 13px; line-height: 20px; white-space: nowrap; }

/* ===== Split: step list + detail ===== */
.split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(320px, 420px) minmax(0, 1fr); }
.pane-wrap { display: grid; min-height: 0; }
.list-pane { overflow-y: auto; padding: 20px 16px 32px 20px; border-right: 1px solid var(--border); background: var(--surface); }
.detail-pane { overflow-y: auto; padding: 24px 32px 40px; }
.step { position: relative; padding-left: 28px; }
.step + .step { margin-top: 4px; }
.step::before { content: ""; position: absolute; left: 9px; top: 28px; bottom: -6px; width: 2px; background: var(--border); }
.step:last-child::before { display: none; }
.step-head { position: relative; display: flex; align-items: center; gap: 8px; height: 32px; margin-left: -28px; font-weight: 600; }
.step-head .par { color: var(--faint); font-size: 12px; font-weight: 500; }
.step-head .n { margin-left: auto; color: var(--faint); font-size: 13px; font-weight: 400; }
.step[data-st="pending"] .step-head { color: var(--muted); font-weight: 500; }
.step-body { display: flex; flex-direction: column; gap: 4px; padding: 0 0 8px; }
.step-body .agent { margin-left: -12px; width: calc(100% + 12px); }
.step-empty { padding: 2px 0 10px; color: var(--faint); font-size: 13px; }
.loop-note { display: flex; align-items: center; gap: 6px; margin: 2px 0 8px; padding: 8px 10px; border-radius: var(--r-sm); background: var(--cut-bg); color: var(--cut); font-size: 13px; font-weight: 500; }

/* Agent detail (pane on wide screens, drawer below 1024px) */
.d-head { display: flex; align-items: flex-start; gap: 12px; }
.d-head > div { min-width: 0; }
.d-head h2 { margin: 8px 0 0; font-size: 18px; font-weight: 600; line-height: 26px; overflow-wrap: anywhere; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px; background: var(--done-bg); color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; }
.badge[data-st="run"] { background: var(--run-bg); color: var(--run); }
.badge[data-st="cut"] { background: var(--cut-bg); color: var(--cut); }
.badge[data-st="stalled"] { background: var(--stalled-bg); color: var(--stalled); }
.now { display: flex; gap: 10px; align-items: flex-start; margin-top: 20px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--run-bg); }
.now[data-st="cut"] { background: var(--cut-bg); }
.now[data-st="stalled"] { background: var(--stalled-bg); }
.now > div { min-width: 0; }
.now .t { font-weight: 600; color: var(--run); overflow-wrap: anywhere; }
.now[data-st="cut"] .t { color: var(--cut); }
.now[data-st="stalled"] .t { color: var(--stalled); }
.now .s { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.sec { margin-top: 28px; }
.sec h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
.tools { margin: 0; padding: 0; list-style: none; }
.tools li { display: grid; grid-template-columns: 52px minmax(64px, max-content) minmax(0, 1fr); gap: 12px; padding: 7px 0; border-top: 1px solid var(--border); font-size: 13px; }
.tools li:first-child { border-top: 0; }
.tools .tm { color: var(--faint); }
.tools .tn { min-width: 0; max-width: 200px; overflow: hidden; text-overflow: ellipsis; font-weight: 600; white-space: nowrap; }
.tools .tt { min-width: 0; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
.detail-pane > * { max-width: 820px; }
.report { text-wrap: pretty; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); color: var(--text); overflow-wrap: anywhere; }
.report > * { margin: 0; }
.report > * + * { margin-top: 8px; }
.report ul, .report ol { padding-left: 20px; }
.report li + li { margin-top: 2px; }
.report .h { font-weight: 600; }
.report table { border-collapse: collapse; font-size: 13px; }
.report th, .report td { padding: 4px 12px 4px 0; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.report th { font-weight: 600; }
.report .tbl { overflow-x: auto; }
.report pre.code { margin: 0; padding: 10px 12px; overflow-x: auto; border-radius: 6px; background: var(--selected); font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; line-height: 1.5; white-space: pre; }
.report * + pre.code, .report pre.code + * { margin-top: 8px; }
.brief-sec summary { display: inline-flex; align-items: center; gap: 6px; height: 32px; margin-left: -6px; padding: 0 8px 0 6px; border-radius: var(--r-sm); font-weight: 600; cursor: pointer; list-style: none; }
.brief-sec summary::-webkit-details-marker { display: none; }
.brief-sec summary:hover, .brief-sec summary:focus-visible { background: var(--item-hover); }
.brief-sec summary .ico { color: var(--muted); rotate: -90deg; transition: rotate .15s; }
.brief-sec[open] summary .ico { rotate: 0deg; }
.brief { margin: 4px 0 0; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.report code { padding: 1px 4px; border-radius: 4px; background: var(--selected); font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; }
.muted-box { padding: 14px 16px; border: 1px dashed var(--border-strong); border-radius: var(--r-sm); color: var(--faint); }

.drawer-wrap { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
.drawer-wrap .scrim { position: absolute; inset: 0; background: rgb(0 0 0 / .25); opacity: 0; transition: opacity .2s; }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); overflow-y: auto; padding: 20px 24px 40px; background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--elevation); translate: 100% 0; visibility: hidden; transition: translate .25s cubic-bezier(.2,.8,.2,1), visibility 0s linear .25s; }
body[data-drawer] .drawer-wrap { pointer-events: auto; }
body[data-drawer] .drawer-wrap .scrim { opacity: 1; }
body[data-drawer] .drawer { translate: 0 0; visibility: visible; transition: translate .25s cubic-bezier(.2,.8,.2,1), visibility 0s; }
.icon-btn { display: grid; place-items: center; width: 32px; height: 32px; margin-left: auto; flex: none; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: var(--item-hover); color: var(--text); }

/* ===== States ===== */
.page { max-width: 1280px; margin: 0 auto; padding: 24px 20px 48px; width: 100%; }
.skel { height: 14px; border-radius: 4px; background: var(--selected); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); }
.skel-row { display: grid; grid-template-columns: 20px 1fr 60px; gap: 10px; padding: 12px; }
.empty { display: grid; justify-items: center; gap: 8px; max-width: 420px; margin: 64px auto; text-align: center; }
.empty .ic { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--selected); color: var(--muted); }
.empty h2 { margin: 4px 0 0; font-size: 16px; font-weight: 600; }
.empty p { margin: 0; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border: 1px solid var(--border-strong); border-radius: var(--r-sm); background: var(--surface); font-weight: 500; cursor: pointer; }
.btn:hover { background: var(--item-hover); }
.banner-wrap { flex: none; width: 100%; max-width: 1280px; margin: 0 auto; padding: 16px 20px 0; }
.banner { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding: 10px 14px; border-radius: var(--r-sm); background: var(--cut-bg); color: var(--cut); font-weight: 500; }
.banner .btn { margin-left: auto; height: 30px; }
.stale .split { opacity: .6; }

/* ===== Narrow screens ===== */
@media (max-width: 1023px) {
  .app { height: auto; min-height: 100dvh; }
  .split { grid-template-columns: minmax(0, 1fr); flex: 1 0 auto; }
  .list-pane { border-right: 0; padding: 16px; overflow: visible; }
  .detail-wrap { display: none !important; }
}
@media (max-width: 767px) {
  .app-top { padding: 0 12px; gap: 8px; }
  .brand span:last-child { display: none; }
  .picker .crumb { display: none; }
  .picker { position: static; }
  .menu { position: fixed; top: 60px; left: 12px; right: 12px; width: auto; }
  .live span { display: none; }
  .page { padding: 16px 12px 40px; }
  .banner-wrap { padding: 12px 12px 0; }
  .counts { margin-left: 0; }
  .drawer { padding: 16px; }
  .tools li { grid-template-columns: 44px minmax(56px, max-content) minmax(0, 1fr); gap: 8px; }
  .tools .tn { max-width: 120px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="app-top">
    <div class="brand"><span class="brand-mark" aria-hidden="true">a</span><span>agent-kit</span></div>
    <div class="picker" id="picker">
      <button type="button" id="pickerBtn" aria-haspopup="true" aria-expanded="false" aria-controls="pickerMenu"><span class="crumb" id="pickerCrumb"></span><span class="name" id="pickerName">Đang tải…</span><svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="menu" id="pickerMenu"></div>
    </div>
    <span class="live" id="live" role="status"><i></i><span>Live</span></span>
  </header>
  <div class="banner-wrap" id="alert" hidden></div>
  <main class="page" id="loading" style="max-width:880px" aria-busy="true">
    <p class="sr-only">Đang tải session…</p>
    <div><div class="skel" style="width:220px;height:24px;margin-bottom:8px"></div><div class="skel" style="width:340px;max-width:100%;margin-bottom:24px"></div></div>
    <div class="card" aria-hidden="true">
      <div class="skel-row"><div class="skel" style="height:20px;border-radius:50%"></div><div class="skel" style="width:70%"></div><div class="skel"></div></div>
      <div class="skel-row"><div class="skel" style="height:20px;border-radius:50%"></div><div class="skel" style="width:62%"></div><div class="skel"></div></div>
      <div class="skel-row"><div class="skel" style="height:20px;border-radius:50%"></div><div class="skel" style="width:54%"></div><div class="skel"></div></div>
      <div class="skel-row"><div class="skel" style="height:20px;border-radius:50%"></div><div class="skel" style="width:46%"></div><div class="skel"></div></div>
      <div class="skel-row"><div class="skel" style="height:20px;border-radius:50%"></div><div class="skel" style="width:38%"></div><div class="skel"></div></div>
    </div>
  </main>
  <main class="page" id="empty" hidden>
    <div class="empty">
      <div class="ic"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></svg></div>
      <h2>Session này chưa gọi agent nào</h2>
      <p>Agent hiện ở đây ngay khi skill trong session gọi Agent tool. Trang tự cập nhật.</p>
      <button class="btn" type="button" id="emptyPick">Chọn session khác</button>
    </div>
  </main>
  <main class="split" id="content" hidden>
    <div class="pane-wrap"><div class="list-pane" id="listPane">
      <div class="summary">
        <div><h1 id="sumTitle"></h1><div class="meta" id="sumMeta"></div></div>
        <div class="counts" id="counts"></div>
      </div>
      <div class="rounds" id="rounds" hidden><span class="seg" id="seg" role="group" aria-label="Vòng"></span><span class="round-note" id="roundNote"></span></div>
      <div id="steps"></div>
    </div></div>
    <div class="pane-wrap detail-wrap"><div class="detail-pane" id="detailPane"></div></div>
  </main>
</div>
<div class="drawer-wrap"><div class="scrim" id="scrim"></div><aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Chi tiết agent" inert></aside></div>
<div class="sr-only" id="announcer" role="status" aria-atomic="true"></div>
<script>
'use strict';
// Icons: SVG paths from Lucide (https://lucide.dev), ISC License,
// Copyright (c) Lucide Contributors. Static constants only — never user text.
const ICONS = {
  done: '<path d="M20 6 9 17l-5-5"/>',
  run: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
  cut: '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/>',
  stalled: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  pending: '<circle cx="12" cy="12" r="9"/>',

  const st = stOf(a);
  return el('button', { type: 'button', class: 'agent', 'data-st': st, 'data-id': a.id, 'aria-current': a.id === S.sel ? 'true' : 'false', title: `${shortType(a.type)} — ${nameOf(a)}`, onclick: (e) => selectAgent(a.id, e.currentTarget) },
    stIcon(st), el('span', { class: 'nm' }, el('span', { class: 'sr-only' }, `${ST_LABEL[st]}: `), nameOf(a)), el('span', { class: 'dur', 'data-dur': a.id }, agentDur(a)));
}
// Rebuilt only when what it shows changes, so running spinners keep turning between SSE frames.
function renderGroups(groups) {
  const sig = JSON.stringify(groups.map((g) => [g.key, g.st, g.label, g.count, g.empty, g.loop, g.agents.map((a) => [a.id, a.status, nameOf(a), a.endedAt])]));
  if (sig === S.groupsSig) {
    for (const r of $('steps').querySelectorAll('.agent')) r.setAttribute('aria-current', r.dataset.id === S.sel ? 'true' : 'false');
    return;
  }
  S.groupsSig = sig;
  const focusedId = document.activeElement && document.activeElement.closest('#steps .agent') ? document.activeElement.dataset.id : null;
  $('steps').replaceChildren(...groups.map((g) => el('div', { class: 'step', 'data-st': g.st },
    el('div', { class: 'step-head' }, stIcon(g.st), g.label, g.par ? el('span', { class: 'par' }, 'song song') : null, g.count ? el('span', { class: 'n' }, g.count) : null),
    el('div', { class: 'step-body' },
      g.agents.length ? g.agents.map(agentRow) : el('div', { class: 'step-empty' }, g.empty),
      g.loop ? el('div', { class: 'loop-note' }, icon('loop', 'ico ico-sm'), g.loop) : null))));
  if (focusedId) { const r = $('steps').querySelector(`.agent[data-id="${CSS.escape(focusedId)}"]`); if (r) r.focus({ preventScroll: true }); }
}

// ---------- detail ----------
function selectAgent(id, row) {
  S.sel = id; S.userSel = true; S.detailSig = '';
  for (const r of document.querySelectorAll('#steps .agent')) r.setAttribute('aria-current', r.dataset.id === id ? 'true' : 'false');
  if (wide.matches) { renderDetail(); $('detailPane').scrollTop = 0; return; }
  openDrawer(row);
}
// Minimal Markdown for reports: paragraphs, headings, lists, **bold**, `code`.
// Builds DOM nodes from text only (no innerHTML), so report text can never inject markup.
function mdInline(text) {
  return text.split(/(\*\*[^*]+\*\*|`[^`]+`)/).filter(Boolean).map((t) =>
    t.startsWith('**') && t.endsWith('**') && t.length > 4 ? el('strong', null, mdInline(t.slice(2, -2)))
      : t.startsWith('`') && t.endsWith('`') && t.length > 2 ? el('code', null, t.slice(1, -1)) : t);
}
function mdBlocks(src) {
  const out = [];
  let list = null;
  let para = [];
  let fence = null; // lines of an open ``` block
  const flush = () => { if (para.length) out.push(el('p', null, mdInline(para.join(' ')))); para = []; };
  for (const raw of String(src).replace(/\r/g, '').split('\n')) {
    const line = raw.trim();
    if (/^```/.test(line)) {
      if (fence) { out.push(el('pre', { class: 'code' }, fence.join('\n'))); fence = null; }
      else { flush(); list = null; fence = []; }
      continue;
    }
    if (fence) { fence.push(raw); continue; }
    const li = /^(?:[-*]|\d+[.)])\s+(.*)$/.exec(line);
    if (!line || /^-{3,}$/.test(line)) { flush(); list = null; continue; }
    if (/^\|.*\|$/.test(line)) {
      flush(); list = null;
      if (/^\|[\s:|-]+\|$/.test(line)) continue; // header separator row
      const cells = line.slice(1, -1).split('|').map((c) => c.trim());
      let tb = out[out.length - 1];
      const head = !(tb && tb.classList.contains('tbl'));
      if (head) { tb = el('div', { class: 'tbl' }, el('table')); out.push(tb); }
      tb.firstChild.append(el('tr', null, cells.map((c) => el(head ? 'th' : 'td', null, mdInline(c)))));
      continue;
    }
    if (/^#{1,6}\s/.test(line)) { flush(); list = null; out.push(el('p', { class: 'h' }, mdInline(line.replace(/^#+\s*/, '')))); continue; }
    if (li) {
      flush();
      const tag = /^\d/.test(line) ? 'ol' : 'ul';
      if (!list || list.tagName.toLowerCase() !== tag) { list = el(tag, tag === 'ol' ? { start: parseInt(line, 10) || 1 } : null); out.push(list); }
      list.append(el('li', null, mdInline(li[1])));
      continue;
    }
    if (list && /^\s{2,}/.test(raw)) { list.lastChild.append(' ', ...mdInline(line)); continue; }
    list = null;
    para.push(line);
  }
  flush();
  if (fence) out.push(el('pre', { class: 'code' }, fence.join('\n')));
  return out;
}
function detailNodes(a, inDrawer) {
  const st = stOf(a);
  const last = a.lastTool || (a.toolTimeline || [])[a.toolTimeline.length - 1] || null;
  const head = el('div', { class: 'd-head' },
    el('div', null, el('span', { class: 'badge', 'data-st': st }, ST_LABEL[st]), el('h2', { id: inDrawer ? 'drawerTitle' : null }, nameOf(a))),
    inDrawer ? el('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Đóng', onclick: () => closeDrawer(true) }, icon('x')) : null);
  let now = null;
  if (st === 'run') {
    const l = a.doingNowLabel || { verb: 'Đang chạy', object: '' };
    const sub = last ? [last.tool, last.target, el('span', { 'data-ago': last.ts || '' }, ago(last.ts))].filter(Boolean) : [l.object];
    now = el('div', { class: 'now', 'data-st': st, 'aria-live': 'polite' }, stIcon(st), el('div', null, el('div', { class: 't' }, 'Đang làm'),
      el('div', { class: 's' }, ...sub.flatMap((x, i) => (i ? [' · ', x] : [x])))));
  } else if (st === 'stalled') {
    const t = msOf(a.lastActivityAt);
    const lastTxt = last ? `Lần cuối: ${last.tool}${last.target ? ` ${last.target}` : ''} lúc ${hhmm(last.ts)}.` : '';
    now = el('div', { class: 'now', 'data-st': st, 'aria-live': 'polite' }, stIcon(st), el('div', null,
      el('div', { class: 't' }, `Không ghi gì ${t == null ? '' : dur(Date.now() - t)}`), lastTxt ? el('div', { class: 's' }, lastTxt) : null));
  } else if (st === 'cut') {
    const s = msOf(a.startedAt); const e = msOf(a.lastActivityAt);
    const sub = `${hhmm(a.lastActivityAt)} · Agent dừng${s != null && e != null ? ` sau ${dur(e - s)}` : ''}${a.report ? '.' : ', chưa gửi report.'}`;
    now = el('div', { class: 'now', 'data-st': st, 'aria-live': 'polite' }, stIcon(st), el('div', null,
      el('div', { class: 't' }, `Bị cắt: ${a.statusReason || 'không rõ lý do'}`), el('div', { class: 's' }, sub)));
  }
  const report = a.report
    ? el('div', { class: 'report' }, mdBlocks(a.report))
    : el('div', { class: 'muted-box' }, st === 'cut' ? 'Không có report: agent bị cắt trước khi xong.' : st === 'done' ? 'Agent xong nhưng không gửi report.' : 'Chưa có report. Report hiện ở đây khi agent xong.');
  const tools = (a.toolTimeline || []).slice(-5).reverse();
  return [head, now || '',
    el('section', { class: 'sec' }, el('h3', null, 'Report'), report),
    tools.length ? el('section', { class: 'sec sec-tools' }, el('h3', null, 'Tool gần nhất'), el('ol', { class: 'tools' }, tools.map((t) =>
      el('li', null, el('span', { class: 'tm' }, hhmm(t.ts)), el('span', { class: 'tn', title: t.tool }, String(t.tool || '').replace(/^mcp__[^_]+(?:_[^_]+)*?__/, '')), el('span', { class: 'tt', title: t.target || '' }, t.target || (t.label && t.label.object) || ''))))) : '',
    a.brief ? el('details', { class: 'sec brief-sec' }, el('summary', null, icon('chev', 'ico ico-sm'), 'Brief'), el('p', { class: 'brief' }, a.brief)) : ''];
}
// A new tool call on the same agent only patches the "now" text and the tool list;
// anything else (other agent, new status, report) rebuilds the detail.
function patchLive(box, a, inDrawer) {
  const fresh = el('div', null, detailNodes(a, inDrawer));
  const oldNow = box.querySelector('.now');
  const newNow = fresh.querySelector('.now');
  if (oldNow && newNow) oldNow.lastChild.replaceWith(newNow.lastChild);
  const oldTools = box.querySelector('.sec-tools');
  const newTools = fresh.querySelector('.sec-tools');
  if (oldTools && newTools) oldTools.replaceWith(newTools);
  else if (newTools) box.append(newTools);
}
function renderDetail() {
  const a = S.data && S.data.agents.find((x) => x.id === S.sel);
  const tl = a && a.toolTimeline ? a.toolTimeline.length : 0;
  const base = a ? `${a.id}|${a.status}|${(a.report || '').length}|${a.statusReason}|${wide.matches}` : '';
  const sig = `${base}|${tl}|${a ? a.lastActivityAt : ''}`;
  if (sig === S.detailSig) return;
  const live = !!S.detailSig && S.detailSig.startsWith(`${base}|`);
  S.detailSig = sig;
  if (live) {
    patchLive($('detailPane'), a, false);
    if (document.body.hasAttribute('data-drawer')) patchLive($('drawer'), a, true);
    return;
  }
  const pane = $('detailPane');
  const top = pane.scrollTop;
  pane.replaceChildren(...(a ? detailNodes(a, false) : []));
  pane.scrollTop = top;
  if (document.body.hasAttribute('data-drawer')) {
    if (!a) { closeDrawer(false); return; }
    const dr = $('drawer');
    const dtop = dr.scrollTop;
    const hadFocus = dr.contains(document.activeElement);
    dr.replaceChildren(...detailNodes(a, true));
    dr.scrollTop = dtop;
    if (hadFocus) dr.querySelector('.icon-btn').focus({ preventScroll: true });
  }
}

// ---------- drawer (below 1024px) ----------
const drawer = $('drawer');
function openDrawer(opener) {
  S.opener = opener;
  const a = S.data && S.data.agents.find((x) => x.id === S.sel);
  if (!a) return;
  drawer.replaceChildren(...detailNodes(a, true));
  drawer.setAttribute('aria-labelledby', 'drawerTitle');
  drawer.removeAttribute('inert');
  document.body.setAttribute('data-drawer', '');
  drawer.scrollTop = 0;
  drawer.querySelector('.icon-btn').focus({ preventScroll: true });
}
function closeDrawer(restore) {
  if (!document.body.hasAttribute('data-drawer')) return;
  document.body.removeAttribute('data-drawer');
  drawer.setAttribute('inert', '');
  const o = S.opener;
  S.opener = null;
  if (!restore || !o) return;
  const row = document.contains(o) ? o : $('steps').querySelector(`.agent[data-id="${CSS.escape(S.sel || '')}"]`);
  if (row) row.focus({ preventScroll: true });
}
$('scrim').addEventListener('click', () => closeDrawer(true));
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (picker.hasAttribute('data-open')) { e.preventDefault(); closePicker(true); return; }
  if (document.body.hasAttribute('data-drawer')) { e.preventDefault(); closeDrawer(true); }
});
// Focus stays inside the open drawer.
drawer.addEventListener('keydown', (e) => {
  if (e.key !== 'Tab') return;
  const f = [...drawer.querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"])')];
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
});
wide.addEventListener('change', () => { if (wide.matches) closeDrawer(false); S.detailSig = ''; renderDetail(); });

// ---------- live status region: only meaningful changes, at most one message per 1.5s ----------
const ANN_GAP = 1500;
const ann = { last: 0, timer: null, queue: [] };
function announce(msg) {
  if (!msg || ann.queue.includes(msg)) return;
  ann.queue.push(msg);
  if (ann.timer) return;
  ann.timer = setTimeout(flushAnnounce, Math.max(0, ann.last + ANN_GAP - Date.now()));
}
function flushAnnounce() {
  ann.timer = null;
  if (!ann.queue.length) return;
  const msg = ann.queue.join('. ');
  ann.queue = [];
  ann.last = Date.now();
  const box = $('announcer');
  box.textContent = '';
  setTimeout(() => { box.textContent = msg; }, 30); // re-set so a repeated message is spoken again
}
function announceChanges(d, sum) {
  const prev = S.ann;
  const statuses = new Map(d.agents.map((a) => [a.id, a.status]));
  S.ann = { sid: S.sessionId, mode: sum.mode, label: sum.label, statuses };
  if (!prev || prev.sid !== S.sessionId) return; // first frame of a session: nothing "changed"
  if (sum.mode === 'finished' && prev.mode !== 'finished') announce('Pipeline hoàn tất');
  else if (sum.mode === 'stopped' && prev.mode !== 'stopped') announce(`Pipeline dừng ở bước ${sum.label}`);
  else if ((sum.mode === 'active' || sum.mode === 'waiting') && sum.label && sum.label !== prev.label) announce(`Chuyển sang bước ${sum.label}`);
  for (const a of d.agents) {
    const was = prev.statuses.get(a.id);
    if (a.status === 'cut' && was && was !== 'cut') announce(`Agent ${nameOf(a)} bị cắt`);
  }
}

// ---------- live clock ----------
setInterval(() => {
  for (const n of document.querySelectorAll('[data-ago]')) {
    const iso = n.getAttribute('data-ago');
    if (iso) setText(n, ago(iso));
  }
  if (!S.data) return;
  for (const n of document.querySelectorAll('[data-dur]')) {
    const a = S.data.agents.find((x) => x.id === n.getAttribute('data-dur'));
    if (a && (a.status === 'running' || a.status === 'stalled')) setText(n, agentDur(a));
  }
}, 1000);

loadProjects();
